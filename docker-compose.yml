services:
  rabbit-encoder:
    image: rabbitcompany/rabbit-encoder:latest
    container_name: rabbit-encoder
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    # NVIDIA GPUs (needs the NVIDIA Container Toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    ports:
      - "3000:3000"
    volumes:
      - ./input:/data/input
      - ./output:/data/output
      - ./temp:/data/temp
      - ./fonts-user:/config/fonts
      - ./vapoursynth-user:/config/vapoursynth
      # Mount a host font directory read-only to import fonts into groups
      # - /usr/share/fonts:/system-fonts:ro
      # Mount your media library folders for in-place encoding
      # - /mnt/HDD/media/Animes:/Animes
      # - /mnt/HDD/media/Shows:/Shows
      # - /mnt/HDD/media/Movies:/Movies
      # Keep the originals of in-place library encodes (see RECYCLE_BIN_DIR)
      # - /mnt/HDD/media/recycle-bin:/recycle-bin
    environment:
      # Server
      - PORT=3000
      - PASSWORD=rabbitencoder

      # File watcher
      # Seconds the file size must stay unchanged before encoding starts
      - FILE_COOLDOWN=30

      # Metadata
      - ORGANIZATION=RabbitCompany

      # Library directories (comma-separated paths inside the container)
      # These folders are browsable from the UI for in-place re-encoding.
      # The encoded file replaces the source and Jellyfin metadata (.nfo, thumbnails) is cleaned up.
      # Files already ending with -{ORGANIZATION}.mkv are recognized as already encoded and skipped.
      # - LIBRARY_DIRS=/Animes,/Shows,/Movies

      # Blu-ray disc naming (Tools > Blu-ray discs). Placeholders are written like Sonarr's and Radarr's.
      # Series: {Series Title} {Series TitleYear} {Series Year} {Year} {ImdbId} {TvdbId} {TmdbId}
      #         {season} {episode} {Episode Title}, padded as {season:00} or {episode:000}
      # Movies: {Movie Title} {Movie TitleYear} {Release Year} {Year} {ImdbId} {TmdbId} {Edition Tags}
      # An empty placeholder takes the brackets around it, or the dash before it, along.
      # Encodes add [Bluray-1080p][Opus 2.0][AV1]-{ORGANIZATION} after the name.
      # - SERIES_FOLDER_FORMAT={Series TitleYear}
      # - SEASON_FOLDER_FORMAT=Season {season:00}
      # - SPECIALS_FOLDER_FORMAT=Specials
      # - EPISODE_FORMAT={Series TitleYear} - S{season:00}E{episode:00} - {Episode Title}
      # - MOVIE_FOLDER_FORMAT={Movie Title} ({Release Year})
      # - MOVIE_FORMAT={Movie Title} ({Release Year}) - {Edition Tags}
      # With IMDb IDs, as the TRaSH guides name them:
      # - MOVIE_FOLDER_FORMAT={Movie Title} ({Release Year}) [imdbid-{ImdbId}]
      # - MOVIE_FORMAT={Movie Title} ({Release Year}) [imdbid-{ImdbId}] - {Edition Tags}

      # Recycle bin (path inside the container, mount it as a volume)
      # Originals of in-place library encodes are moved here instead of being replaced,
      # keeping their folder structure: /Animes/Show/Ep.mkv -> /recycle-bin/Animes/Show/Ep.mkv
      # - RECYCLE_BIN_DIR=/recycle-bin
