services:
  svt-av1-5fish-builder:
    build:
      context: .
      args:
        SVTAV15FISH_REPO: https://github.com/5fish/SVT-AV1.git
        SVTAV15FISH_REF: v2.3.260829
    container_name: rabbit-svt-av1-5fish-builder
    volumes:
      - ./svt-av1-5fish-dist:/out
    environment:
      DEBIAN_FRONTEND: noninteractive
      # Set to 0 to disable profile-guided optimization (faster build, slightly
      # slower encoder). PGO is otherwise applied per-level when the build host
      # can execute that micro-architecture (v4/AVX-512 needs an AVX-512 host).
      ENABLE_PGO: "1"
    tty: true
