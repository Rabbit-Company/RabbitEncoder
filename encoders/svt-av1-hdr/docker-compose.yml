services:
  svt-av1-hdr-builder:
    build:
      context: .
      args:
        SVTAV1HDR_REPO: https://github.com/juliobbv-p/svt-av1-hdr.git
        SVTAV1HDR_REF: v4.2.0
    container_name: rabbit-svt-av1-hdr-builder
    volumes:
      - ./svt-av1-hdr-dist:/out
    environment:
      DEBIAN_FRONTEND: noninteractive
      # Set to 0 to disable profile-guided optimization (faster build, slightly
      # slower encoder). PGO is otherwise applied per-level when the build host
      # can execute that micro-architecture (v4/AVX-512 needs an AVX-512 host).
      ENABLE_PGO: "1"
    tty: true
